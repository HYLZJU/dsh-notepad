<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDF2F9"/><stop offset="1" stop-color="#F8FAFD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A4620" flood-opacity="0.20"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#C9D3E2" opacity="0.7"/>
    </pattern>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#dots)"/>

  <!-- panel -->
  <g filter="url(#shadow)">
    <rect x="330" y="86" width="540" height="592" rx="16" fill="#FFFCF1" stroke="#E7D9AE"/>
    <path d="M330 102a16 16 0 0 1 16-16h508a16 16 0 0 1 16 16v40H330z" fill="#FFF3C6"/>
    <line x1="330" y1="142" x2="870" y2="142" stroke="#EADCAF"/>
  </g>

  <!-- header -->
  <text x="356" y="118" font-size="18" font-weight="650" fill="#5A4300">记事本</text>
  <rect x="424" y="99" width="150" height="24" rx="12" fill="#FFF9DE" stroke="#EADCAF"/>
  <text x="440" y="116" font-size="12" fill="#9A7C24">工作区 · dsh插件</text>
  <g fill="#8A6A10" font-size="19" text-anchor="middle">
    <rect x="758" y="97" width="26" height="26" rx="8" fill="#FFE9A3"/>
    <text x="771" y="116">+</text>
    <rect x="792" y="97" width="26" height="26" rx="8" fill="none"/>
    <text x="805" y="116" fill="#A33118">×</text>
  </g>

  <!-- paper lines -->
  <g stroke="#F1E6C3" stroke-width="1">
    <line x1="352" y1="176" x2="848" y2="176"/><line x1="352" y1="208" x2="848" y2="208"/>
    <line x1="352" y1="240" x2="848" y2="240"/><line x1="352" y1="272" x2="848" y2="272"/>
    <line x1="352" y1="304" x2="848" y2="304"/><line x1="352" y1="336" x2="848" y2="336"/>
    <line x1="352" y1="368" x2="848" y2="368"/><line x1="352" y1="400" x2="848" y2="400"/>
    <line x1="352" y1="432" x2="848" y2="432"/><line x1="352" y1="464" x2="848" y2="464"/>
    <line x1="352" y1="496" x2="848" y2="496"/><line x1="352" y1="528" x2="848" y2="528"/>
  </g>

  <!-- rows -->
  <g>
    <circle cx="368" cy="171" r="7.5" fill="#FFFDF5" stroke="#C9AE62" stroke-width="1.5"/>
    <text x="390" y="176" font-size="14" fill="#43371F">整理 dsh-notepad 的发布说明</text>

    <circle cx="368" cy="235" r="7.5" fill="#FFFDF5" stroke="#C9AE62" stroke-width="1.5"/>
    <text x="390" y="240" font-size="14" fill="#43371F">给 README 加预览图</text>
    <rect x="742" y="220" width="96" height="20" rx="10" fill="#FFF3C6" stroke="#EADCAF"/>
    <text x="752" y="234" font-size="11" fill="#9A7C24">dsh-notepad</text>

    <circle cx="368" cy="299" r="7.5" fill="#C58A00" stroke="#C58A00"/>
    <path d="M364 299l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="390" y="304" font-size="14" fill="#A5946A" text-decoration="line-through">推送 v0.1.6 到 GitHub</text>
    <rect x="752" y="284" width="86" height="20" rx="10" fill="#FFF3C6" stroke="#EADCAF"/>
    <text x="762" y="298" font-size="11" fill="#9A7C24">dsh-notepad</text>

    <circle cx="368" cy="363" r="7.5" fill="#FFFDF5" stroke="#C9AE62" stroke-width="1.5"/>
    <text x="390" y="368" font-size="14" fill="#43371F">把待办按项目筛选，下次再试</text>
  </g>

  <!-- footer -->
  <line x1="330" y1="592" x2="870" y2="592" stroke="#EADCAF"/>
  <rect x="330" y="592" width="540" height="86" fill="#FFF8DE"/>
  <g font-size="13" text-anchor="middle">
    <rect x="352" y="620" width="74" height="32" rx="8" fill="#FFFDF5" stroke="#E2CB8C"/>
    <text x="389" y="641" fill="#6B5314">插入</text>
    <rect x="436" y="620" width="96" height="32" rx="8" fill="#FFFDF5" stroke="#E2CB8C"/>
    <text x="484" y="641" fill="#6B5314">插入全部</text>
    <rect x="542" y="620" width="74" height="32" rx="8" fill="#FFFDF5" stroke="#E2CB8C"/>
    <text x="579" y="641" fill="#6B5314">清空</text>
  </g>

  <!-- resize grip -->
  <g stroke="#DCC288" stroke-width="2">
    <line x1="854" y1="664" x2="862" y2="672"/>
    <line x1="846" y1="664" x2="862" y2="680"/>
    <line x1="838" y1="664" x2="862" y2="688"/>
  </g>

  <!-- callouts -->
  <g font-size="14" fill="#3A4A63">
    <text x="86" y="214">双击空白处</text>
    <text x="86" y="236" font-size="12" fill="#6B7C96">新建一条并自动聚焦</text>
    <path d="M196 228 C 260 232, 300 240, 336 262" fill="none" stroke="#8AA3C4" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="336" cy="262" r="4" fill="#8AA3C4"/>

    <text x="920" y="150">淡黄色便签纸</text>
    <text x="920" y="172" font-size="12" fill="#6B7C96">工具栏标签图标打开</text>
    <path d="M912 162 C 890 190, 878 216, 872 246" fill="none" stroke="#8AA3C4" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="872" cy="246" r="4" fill="#8AA3C4"/>

    <text x="900" y="690">右边 / 底边 / 右下角都能缩放</text>
    <path d="M892 678 C 882 676, 872 674, 864 672" fill="none" stroke="#8AA3C4" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="864" cy="672" r="4" fill="#8AA3C4"/>
  </g>

  <text x="600" y="726" font-size="12" fill="#8A97AB" text-anchor="middle">dsh-notepad · 界面示意（非实机截图）</text>
</svg>
